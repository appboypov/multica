appId: ai.multica.desktop
productName: Multica
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # Never repack the electron-builder output directory into the app.
  # Multi-arch builds (scripts/package.mjs) run each architecture in the
  # same apps/desktop dir with output at dist/mac-<arch>, and
  # electron-builder only auto-excludes the *current* output dir, so the
  # earlier architecture's app would otherwise be pulled into the next
  # architecture's app.asar.
  - "!dist/**"
# Ship the license and attribution notices inside the packaged app, so the
# NOTICE obligations travel with the app rather than only the git repo.
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
protocols:
  - name: Multica
    schemes:
      - multica
asarUnpack:
  - resources/**
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # Electron 39 runs on macOS 12 and later.
  minimumSystemVersion: "12.0.0"
  # The app bundle only: `make desktop-app` copies dist/mac-<arch>/Multica.app
  # into /Applications.
  target:
    - dir
npmRebuild: false
