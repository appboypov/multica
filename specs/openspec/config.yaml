schema: intent-driven

context: |
  appboypov/multica: Brian's own fork of multica-ai/multica, a task management platform
  where people and agents collaborate on issues, released only on his Mac (AGENTS.md "Fork").
  Go backend in server/ (Chi, sqlc, PostgreSQL, WebSocket) with the daemon in
  server/internal/daemon/ that runs agent tasks on the runtime machine; shared TypeScript
  packages core, ui and views for the Next.js web app (apps/web) and the Electron desktop
  app (apps/desktop); an independent Expo mobile app (apps/mobile); docs in apps/docs.
  madspec-sync/ syncs the brain's Organisations and Products to Multica. Rules that bind every change are
  in AGENTS.md: no foreign keys, CONCURRENTLY indexes in their own migration, zod schemas
  with parseWithFallback at the API boundary, no compatibility shims, every check local.

rules:
  proposal:
    - Pressure-test the intent with madspec-grilling before writing; link the owning Intent object in Anytype.
    - Open with At a glance, as ~/.agents/skills/madspec-architecture/visuals/visuals.md says.
  specs:
    - Write requirements and scenarios in Gherkin; every requirement carries at least one scenario with GIVEN, WHEN and THEN steps.
  design:
    - Draw the architecture with madspec-architecture where structure matters.
    - Open with At a glance, as ~/.agents/skills/madspec-architecture/visuals/visuals.md says.
  adr:
    - Follow madspec-architecture; durable decisions are immutable files under adr/.
  tasks:
    - Keep every task a checkbox small enough for one session and name the verification that proves it.
    - Open with At a glance, as ~/.agents/skills/madspec-architecture/visuals/visuals.md says.
